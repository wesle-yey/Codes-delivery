<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery - Painel de Demonstração</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --success: #10b981;
            --danger: #ef4444;
            --info: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 15% 15%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 0.5rem; }
        header p { color: var(--text-muted); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label { display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.35rem; }

        input, select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--primary);
            color: #0f172a;
        }

        button:hover { background: var(--primary-hover); transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-info { background: var(--info); color: white; }

        .pedidos-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        .pedido-item {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            position: relative;
        }

        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-CRIADO { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        .badge-ACEITO { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .badge-RECUSADO { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .badge-ENTREGUE { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }

        .action-box {
            background: rgba(30, 41, 59, 0.5);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            margin-top: 0.75rem;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
        }

        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
    </style>
</head>
<body>

    <header>
        <h1>🚴 Food Delivery</h1>
        <p>Painel de Demonstração e Teste das Regras de Negócio</p>
    </header>

    <div class="container">
        <!-- Cadastros -->
        <div class="card">
            <h2>➕ Cadastros Rápidos</h2>
            
            <form id="form-cliente" style="margin-bottom: 1.5rem;">
                <label>Cadastrar Cliente (E-mail Único)</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="cli-nome" placeholder="Nome" required>
                    <input type="email" id="cli-email" placeholder="Email" required>
                    <button type="submit" id="btn-salvar-cli" style="width: auto;">Salvar</button>
                </div>
            </form>

            <form id="form-restaurante">
                <label>Cadastrar Restaurante</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="rest-nome" placeholder="Nome do Restaurante" required>
                    <button type="submit" id="btn-salvar-rest" style="width: auto;">Salvar</button>
                </div>
            </form>
        </div>

        <!-- Criar Pedido -->
        <div class="card">
            <h2>🛒 Criar Pedido</h2>
            <form id="form-pedido">
                <div class="form-group">
                    <label>Selecione o Cliente Criador</label>
                    <select id="select-cliente" required><option value="">Carregando...</option></select>
                </div>
                <div class="form-group">
                    <label>Selecione o Restaurante Destino</label>
                    <select id="select-restaurante" required><option value="">Carregando...</option></select>
                </div>
                <button type="submit" id="btn-salvar-ped" class="btn-info">Fazer Pedido (Status: CRIADO)</button>
            </form>
        </div>

        <!-- Gestão e Fluxo de Pedidos -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2>📋 Acompanhamento e Teste de Ações de Pedidos</h2>
            <div id="lista-pedidos" class="pedidos-list">
                <p style="color: var(--text-muted);">Nenhum pedido encontrado.</p>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_URL = '/v1';
        let listaClientesCache = [];
        let listaRestaurantesCache = [];

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 4500);
        }

        async function carregarAuxiliares() {
            try {
                const [clientes, restaurantes] = await Promise.all([
                    fetch(`${API_URL}/clientes`).then(r => r.json()),
                    fetch(`${API_URL}/restaurantes`).then(r => r.json())
                ]);

                listaClientesCache = clientes || [];
                listaRestaurantesCache = restaurantes || [];

                const selCli = document.getElementById('select-cliente');
                if (listaClientesCache.length === 0) {
                    selCli.innerHTML = '<option value="">Nenhum cliente cadastrado</option>';
                } else {
                    selCli.innerHTML = listaClientesCache.map(c => `<option value="${c.id}">${c.name} (${c.email}) - ID: ${c.id}</option>`).join('');
                }

                const selRest = document.getElementById('select-restaurante');
                if (listaRestaurantesCache.length === 0) {
                    selRest.innerHTML = '<option value="">Nenhum restaurante cadastrado</option>';
                } else {
                    selRest.innerHTML = listaRestaurantesCache.map(r => `<option value="${r.id}">${r.name} - ID: ${r.id}</option>`).join('');
                }
            } catch (e) {
                console.error("Erro ao carregar dados", e);
            }
        }

        async function carregarPedidos() {
            try {
                const res = await fetch(`${API_URL}/pedidos`);
                const pedidos = await res.json();
                const container = document.getElementById('lista-pedidos');

                if (!pedidos || pedidos.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted);">Nenhum pedido cadastrado ainda.</p>';
                    return;
                }

                container.innerHTML = pedidos.map(p => {
                    const restauranteDono = listaRestaurantesCache.find(r => String(r.id) === String(p.idRestaurante));
                    const clienteDono = listaClientesCache.find(c => String(c.id) === String(p.idCliente));

                    const optionsRestaurantes = listaRestaurantesCache.map(r => 
                        `<option value="${r.id}" ${String(r.id) === String(p.idRestaurante) ? 'selected' : ''}>${r.name} (ID: ${r.id})</option>`
                    ).join('');

                    const optionsClientes = listaClientesCache.map(c => 
                        `<option value="${c.id}" ${String(c.id) === String(p.idCliente) ? 'selected' : ''}>${c.name} (ID: ${c.id})</option>`
                    ).join('');

                    return `
                    <div class="pedido-item">
                        <div class="pedido-header">
                            <strong>Pedido #${p.id}</strong>
                            <span class="badge badge-${p.pedidoStatus}">${p.pedidoStatus}</span>
                        </div>
                        <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.5rem;">
                            Cliente Criador: <b style="color: var(--text);">${clienteDono ? clienteDono.name : 'ID ' + p.idCliente}</b> | 
                            Restaurante Destino: <b style="color: var(--primary);">${restauranteDono ? restauranteDono.name : 'ID ' + p.idRestaurante}</b>
                            ${p.notaPedido ? ` | Nota: <b style="color: var(--primary);">⭐ ${p.notaPedido}/5</b>` : ''}
                        </p>

                        ${(p.pedidoStatus === 'CRIADO' || p.pedidoStatus === 'ACEITO') ? `
                            <div class="action-box">
                                <label>Restaurante Atuante (Selecione para testar validação de pertence):</label>
                                <div style="display: flex; gap: 0.5rem; margin-top: 0.25rem;">
                                    <select id="op-rest-${p.id}">${optionsRestaurantes}</select>
                                    ${p.pedidoStatus === 'CRIADO' ? `
                                        <button class="btn-success" onclick="aceitarPedido(${p.id}, this)">Aceitar</button>
                                        <button class="btn-danger" onclick="recusarPedido(${p.id}, this)">Recusar</button>
                                    ` : ''}
                                    ${p.pedidoStatus === 'ACEITO' ? `
                                        <button class="btn-info" onclick="entregarPedido(${p.id}, this)">Confirmar Entrega</button>
                                    ` : ''}
                                </div>
                            </div>
                        ` : ''}

                        ${(p.pedidoStatus === 'ENTREGUE' && !p.notaPedido) ? `
                            <div class="action-box">
                                <label>Cliente Atuante & Nota (Selecione para testar validação de pertence):</label>
                                <div style="display: flex; gap: 0.5rem; margin-top: 0.25rem;">
                                    <select id="op-cli-${p.id}">${optionsClientes}</select>
                                    <input type="number" id="nota-${p.id}" min="1" max="5" placeholder="Nota (1-5)" style="width: 110px;">
                                    <button class="btn-success" onclick="avaliarPedido(${p.id}, this)">Avaliar</button>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `}).join('');
            } catch (e) {
                console.error("Erro ao carregar pedidos", e);
            }
        }

        document.getElementById('form-cliente').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar-cli');
            btn.disabled = true;
            
            const name = document.getElementById('cli-nome').value;
            const email = document.getElementById('cli-email').value;
            
            try {
                const res = await fetch(`${API_URL}/clientes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });
                
                if (res.ok) {
                    showToast("Cliente cadastrado com sucesso!");
                    e.target.reset();
                    await carregarAuxiliares();
                    carregarPedidos();
                } else {
                    const text = await res.text();
                    showToast(text || "Erro ao cadastrar cliente", true);
                }
            } catch (err) {
                showToast("Erro na requisição", true);
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('form-restaurante').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar-rest');
            btn.disabled = true;
            
            const name = document.getElementById('rest-nome').value;
            
            try {
                const res = await fetch(`${API_URL}/restaurantes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                
                if (res.ok) {
                    showToast("Restaurante cadastrado com sucesso!");
                    e.target.reset();
                    await carregarAuxiliares();
                    carregarPedidos();
                } else {
                    const text = await res.text();
                    showToast(text || "Erro ao cadastrar restaurante", true);
                }
            } catch (err) {
                showToast("Erro na requisição", true);
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('form-pedido').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar-ped');
            btn.disabled = true;
            
            const idCliente = document.getElementById('select-cliente').value;
            const idRestaurante = document.getElementById('select-restaurante').value;
            
            if (!idCliente || !idRestaurante) {
                showToast("Selecione um cliente e um restaurante!", true);
                btn.disabled = false;
                return;
            }

            try {
                const res = await fetch(`${API_URL}/pedidos?idCliente=${idCliente}&idRestaurante=${idRestaurante}`, { method: 'POST' });
                if (res.ok) {
                    showToast("Pedido criado com sucesso (Status: CRIADO)!");
                    carregarPedidos();
                } else {
                    const text = await res.text();
                    showToast(text || "Erro ao criar pedido", true);
                }
            } catch (err) {
                showToast("Erro na requisição", true);
            } finally {
                btn.disabled = false;
            }
        });

        async function aceitarPedido(id, btn) {
            const idRestaurante = document.getElementById(`op-rest-${id}`).value;
            btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/pedidos/aceitar/${id}?idRestaurante=${idRestaurante}`, { method: 'PATCH' });
                const data = await res.text();
                if (res.ok) { showToast("Pedido Aceito com sucesso!"); carregarPedidos(); }
                else { showToast(data, true); btn.disabled = false; }
            } catch (err) { showToast("Erro na requisição", true); btn.disabled = false; }
        }

        async function recusarPedido(id, btn) {
            const idRestaurante = document.getElementById(`op-rest-${id}`).value;
            btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/pedidos/recusar/${id}?idRestaurante=${idRestaurante}`, { method: 'PATCH' });
                const data = await res.text();
                if (res.ok) { showToast("Pedido Recusado!"); carregarPedidos(); }
                else { showToast(data, true); btn.disabled = false; }
            } catch (err) { showToast("Erro na requisição", true); btn.disabled = false; }
        }

        async function entregarPedido(id, btn) {
            const idRestaurante = document.getElementById(`op-rest-${id}`).value;
            btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/pedidos/entregar/${id}?idRestaurante=${idRestaurante}`, { method: 'PATCH' });
                const data = await res.text();
                if (res.ok) { showToast("Pedido Entregue com sucesso!"); carregarPedidos(); }
                else { showToast(data, true); btn.disabled = false; }
            } catch (err) { showToast("Erro na requisição", true); btn.disabled = false; }
        }

        async function avaliarPedido(id, btn) {
            const idCliente = document.getElementById(`op-cli-${id}`).value;
            const nota = document.getElementById(`nota-${id}`).value;
            if (!nota) { showToast("Informe uma nota de 1 a 5", true); return; }
            btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/pedidos/avaliar/${id}?idCliente=${idCliente}&notaPedido=${nota}`, { method: 'POST' });
                const data = await res.text();
                if (res.ok) { showToast("Pedido Avaliado com sucesso!"); carregarPedidos(); }
                else { showToast(data, true); btn.disabled = false; }
            } catch (err) { showToast("Erro na requisição", true); btn.disabled = false; }
        }

        async function init() {
            await carregarAuxiliares();
            await carregarPedidos();
        }

        init();
    </script>
</body>
</html>
